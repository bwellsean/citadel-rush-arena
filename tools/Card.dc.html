</div>
</div>
</sc-if>
<sc-if value="{{c.hasLast}}" hint-placeholder-val="{{false}}">
<div style="position: absolute; right: 0; top: 20px; width: 20px; height: {{leftH}}px; box-sizing: border-box; background: {{c.bgLast}}; border-left: 2px solid #15121c">
<div style="position: absolute; left: 50%; top: 50%; width: {{leftH}}px; height: 18px; transform: translate(-50%, -50%) rotate(90deg); display: flex; align-items: center; justify-content: center; gap: 6px; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 11px; letter-spacing: 0.08em; color: #ffffff">
<span>LAST STAND</span>
<span style="display: flex; align-items: center" aria-label="Health"><svg width="10" height="10" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.7 4.5c2.1 0 3.6 1.2 5.3 3.1 1.7-1.9 3.2-3.1 5.3-3.1 3.7 0 5.8 3.9 4.3 7.3C19.5 16.4 12 21 12 21z" fill="#ffffff" stroke="#15121c" stroke-width="2.4" stroke-linejoin="round"></path></svg></span>
<span style="display: flex; align-items: center; gap: 3px; background: #ffffff; border-radius: 4px; padding: 0 5px; line-height: 13px; color: #15121c"><svg width="11" height="11" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5c-4.7 0-8 3.3-8 7.6 0 2.6 1.3 4.6 3.2 5.8v3.6h9.6v-3.6c1.9-1.2 3.2-3.2 3.2-5.8 0-4.3-3.3-7.6-8-7.6z" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"></path><circle cx="8.8" cy="10.6" r="2" fill="currentColor"></circle><circle cx="15.2" cy="10.6" r="2" fill="currentColor"></circle><path d="M10.4 19.5v2M13.6 19.5v2" stroke="currentColor" stroke-width="2"></path></svg>2+</span>
</div>
</div>
</sc-if>
</sc-if>

<div style="position: absolute; left: {{box.l}}px; top: {{box.t}}px; width: {{box.w}}px; height: {{box.h}}px; display: flex; flex-direction: column; gap: 4px">
<div style="display: flex; align-items: center; gap: 4px; flex-shrink: 0">
<div style="flex: 1; min-width: 0; background: {{c.band}}; border: 2.5px solid #15121c; border-radius: 8px; padding: 1px 8px; font-family: 'Lilita One', sans-serif; font-size: {{c.nameSize}}px; line-height: 21px; text-transform: uppercase; color: {{c.bandInk}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{c.name}}</div>
<div title="{{c.costTitle}}" aria-label="{{c.costTitle}}" style="position: relative; width: 28px; height: 31px; flex-shrink: 0"><svg width="28" height="31" viewBox="0 0 34 38" aria-hidden="true" style="position: absolute; left: 0; top: 0; display: block" style="position: absolute; left: 0; top: 0; display: block"><polygon points="17,1.5 32,10 32,28 17,36.5 2,28 2,10" fill="#ffd36b" stroke="#15121c" stroke-width="2.5" stroke-linejoin="round"></polygon><polygon points="17,7 26.5,12.5 26.5,25.5 17,31 7.5,25.5 7.5,12.5" fill="#f29a2e"></polygon><polyline points="2,10 7.5,12.5 17,7 17,1.5" fill="none" stroke="#15121c" stroke-width="1" stroke-opacity="0.35"></polyline><polyline points="32,28 26.5,25.5 17,31 17,36.5" fill="none" stroke="#15121c" stroke-width="1" stroke-opacity="0.35"></polyline></svg><div style="position: absolute; left: 0; top: 0; width: 28px; height: 31px; display: flex; align-items: center; justify-content: center; font-family: 'Lilita One', sans-serif; font-size: 17px; line-height: 1; color: #15121c">{{c.cost}}</div></div>
</div>
<div style="flex: {{fit.art}}; aspect-ratio: {{fit.ar}}; min-height: 60px; border: 2.5px solid {{c.artBorder}}; border-radius: 6px; position: relative; overflow: hidden; background: {{c.artBg}}">
<sc-if value="{{c.panelArt}}" hint-placeholder-val="{{true}}"><img src="{{c.art}}" alt="{{c.name}} card art" style="width: 100%; height: 100%; object-fit: cover; object-position: 50% {{c.focus}}%; transform: scaleX({{c.flipX}}); display: block"></sc-if>
<sc-if value="{{c.noArt}}" hint-placeholder-val="{{false}}"><div style="width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; background: repeating-linear-gradient(135deg, #2a2833 0 8px, #322f3d 8px 16px)"><div style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 12px; letter-spacing: 0.1em; color: {{c.accent}}">PLAYTEST CARD</div></div></sc-if>
<sc-if value="{{c.isChar}}" hint-placeholder-val="{{true}}"><div style="position: absolute; right: 4px; top: 4px; display: flex; gap: 4px"><div style="background: {{c.chipBg}}; border: 2px solid #15121c; border-radius: 6px; padding: 0 5px; display: flex; align-items: baseline; gap: 2px; box-shadow: 0 2px 0 rgba(12, 10, 16, 0.5)"><span style="font-family: 'Lilita One', sans-serif; font-size: 15px; line-height: 18px; color: #c2361c">{{c.atk}}</span><span style="font-family: 'Barlow Condensed', sans-serif; font-size: 8px; font-weight: 700; color: #15121c">ATK</span></div><div style="background: {{c.chipBg}}; border: 2px solid #15121c; border-radius: 6px; padding: 0 5px; display: flex; align-items: baseline; gap: 2px; box-shadow: 0 2px 0 rgba(12, 10, 16, 0.5)"><span style="font-family: 'Lilita One', sans-serif; font-size: 15px; line-height: 18px; color: #2f8a3e">{{c.mov}}</span><span style="font-family: 'Barlow Condensed', sans-serif; font-size: 8px; font-weight: 700; color: #15121c">MOV</span></div></div></sc-if>
<div style="position: absolute; left: 4px; right: 4px; bottom: 4px; display: flex"><div style="max-width: 100%; box-sizing: border-box; background: {{c.typeBg}}; color: {{c.accent}}; border-radius: 4px; padding: 1px 6px; font-family: 'Barlow Condensed', sans-serif; font-size: 9px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{c.typeLine}}</div></div>
</div>
<div style="flex: {{fit.text}}; background: {{c.textBg}}; border: 2.5px solid #15121c; border-radius: 7px; padding: 4px 7px; color: {{c.textInk}}; display: flex; flex-direction: column; gap: 3px">
<sc-if value="{{c.showPattern}}" hint-placeholder-val="{{false}}"><div style="font-size: {{c.textSize}}px; line-height: 1.22; color: {{c.subInk}}"><span style="font-weight: 700; text-transform: uppercase">Attacks:</span> {{c.pattern}}</div></sc-if>
<div style="font-size: {{c.textSize}}px; line-height: 1.22"><span style="font-weight: 700; text-transform: uppercase; color: {{c.key}}">{{c.lead}}:</span> {{c.text}}</div>
<sc-for list="{{c.extra}}" as="x" hint-placeholder-count="1"><div style="font-size: {{c.textSize}}px; line-height: 1.22"><span style="font-weight: 700; text-transform: uppercase; color: {{c.key}}">{{x.lead}}:</span> {{x.text}}</div></sc-for>
<sc-if value="{{c.showLasts}}" hint-placeholder-val="{{false}}"><div style="font-size: {{c.textSize}}px; line-height: 1.22"><span style="font-weight: 700; text-transform: uppercase; color: {{c.key}}">Lasts:</span> {{c.duration}}</div></sc-if>
<div style="font-size: 9px; font-style: {{c.footStyle}}; line-height: 1.22; color: {{c.footInk}}; white-space: {{c.footWrap}}; overflow: hidden; text-overflow: ellipsis">{{c.foot}}</div>
</div>
</div>

</div>
</sc-if>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"cardName":{"editor":"text","default":"Aegis"},"cardW":{"editor":"number","default":226},"cardH":{"editor":"number","default":322},"$preview":{"width":226,"height":322}}'>
class Component extends DCLogic {
  renderVals() {
    const trapHow = "Place face-down on an empty square in your half. Discard after it triggers.";
    const upgradeHow = "Attach to one of your Runners on the board. Max 1 upgrade per Runner.";
    const runners = [
      { faction: "Sentinels", kind: "char", name: "Aegis", cost: 3, title: "Lenore", meta: "Sentinels · Powered · Tank", atk: 2, steps: [9, 5], mov: 1, pattern: "Default (adjacent enemy ahead)", ability: "Guardian", freq: "once per turn", text: "When a friendly Runner directly beside Aegis (same row, neighboring lane) is attacked, Aegis may take the attack instead and hit back.", flavor: "“Behind me. Stay behind me.”" },
      { faction: "Sentinels", kind: "char", name: "Waypoint", cost: 1, title: "Wren", meta: "Sentinels · Tech · Scout", atk: 2, steps: [3], mov: 2, pattern: "Default (adjacent enemy ahead)", ability: "Clear the Path", freq: "once per turn", text: "Instead of attacking, choose a face-down enemy trap within 2 squares ahead in Waypoint's lane. Discard it without triggering it, or flip it face-up if a Runner is on it.", flavor: "“Every path through the rift has a trap on it. I just find it first.”" },
      { faction: "Sentinels", kind: "char", name: "Tinder", cost: 3, title: "Kestrel", meta: "Sentinels · Powered · Striker", atk: 3, steps: [5], mov: 1, pattern: "Any square in the next row ahead: directly in front or diagonally ahead on either side", ability: "Overcharge", freq: "once per turn", text: "When Tinder attacks, he may add +3 damage. If he does, the target does not hit back, and Tinder takes 2 damage after the attack.", flavor: "“You got the brains. I got the fire.”" },
      { faction: "Sentinels", kind: "char", name: "Zenith", cost: 5, title: "Solenne", meta: "Sentinels · Powered · Artillery", atk: 3, steps: [5], mov: 1, pattern: "Any square 2 to 3 ahead in her lane. Ignores Blockers on the square 2 ahead.", ability: "Radiant Barrage", freq: "once per game", text: "Instead of attacking, choose up to 2 enemy Runners ahead of Zenith in her lane. Each takes 2 damage. The closest one hits back.", flavor: "“Look up.”" },
      { faction: "Sentinels", kind: "char", name: "Lumen", cost: 1, title: "Dr. Elias Marsh", meta: "Sentinels · Powered · Support", atk: 1, steps: [4], mov: 1, pattern: "Default (adjacent enemy ahead)", ability: "Purge", freq: "once per turn", text: "Instead of attacking, restore 1 Health to a friendly Runner next to Lumen. If it is Powered, also remove a trap effect from it (Stunned or Double Damage). Can't target the same Runner on back-to-back turns.", flavor: "“Hold still. This part glows.”" },
      { faction: "Syndicate", kind: "char", name: "Blink", cost: 2, title: "Indira", meta: "Syndicate · Powered · Burst", atk: 4, steps: [3], mov: 1, pattern: "Default (adjacent enemy ahead)", ability: "Quick Strike", freq: "once per game", text: "Instead of attacking normally, Blink attacks the same target twice, each hit dealing 3 damage. The target hits back after each attack.", flavor: "“You blinked. That was your mistake.”" },
      { faction: "Syndicate", kind: "char", name: "Anvil", cost: 3, title: "Gunnar", meta: "Syndicate · Tech · Heavy ranged", atk: 4, steps: [4], mov: 1, pattern: "1 or 2 squares ahead in his lane", ability: "Suppressive Fire", freq: "once per game", text: "Instead of attacking, stun each enemy in the next row ahead: the square directly in front of him and the squares diagonally ahead on each side. Lasts one round.", flavor: "“I don't need to hit you. I need you to stay down.”" },
      { faction: "Syndicate", kind: "char", name: "Lockstep", cost: 3, title: "Rook", meta: "Syndicate · Tech · Lane defender", atk: 2, steps: [8, 4], mov: 1, pattern: "Default (adjacent enemy ahead)", ability: "Halcyte Plating", freq: "once per turn", text: "Plating 2 against the first attack from a Powered Runner each turn (that attack deals 2 less damage).", flavor: "“She kept us safe for years. Now it's our turn.”" },
      { faction: "Syndicate", kind: "char", name: "Gremlin", cost: 1, title: "Silas Morrow", meta: "Syndicate · Tech · Engineer", atk: 2, steps: [4], mov: 1, pattern: "Default (adjacent enemy ahead)", ability: "Field Rigging", freq: "once per turn", text: "Instead of attacking, place a Trap from your hand face-down on an empty square next to Gremlin (any direction), even outside your half.", flavor: "“I've been building the end of the world for fifty years. I'm getting good at it.”" },
      { faction: "Syndicate", kind: "char", name: "Hornet", cost: 2, title: "Mara Voss", meta: "Syndicate · Tech · Artillery", atk: 2, steps: [3], mov: 1, pattern: "Exactly 2 rows ahead, in her lane or a neighboring lane. Ignores Blockers.", ability: "Remote Operated", freq: "once per game", text: "When Hornet attacks, the target doesn't hit back.", flavor: "“You won't see me coming. You'll hear the drone.”" },
      { faction: "Sentinels", kind: "char", name: "Faedra", cost: 6, title: "Faedra", meta: "Sentinels · Powered · Champion", atk: 4, steps: [9, 6, 5], mov: 1, pattern: "Default", ability: "Radiance", freq: "passive", textSize: 8.5, text: "Other friendly Runners in her row get +1 ATK.", extra: [{ lead: "Dawn · once per game", text: "Instead of attacking, return a Runner from your discard pile to an empty back-row square. All friendly Runners restore 1 Health. Faedra is stunned until next turn." }], flavor: "“I've watched a hundred worlds burn. Not this one.”" },
      { faction: "Sentinels", kind: "char", name: "Herald", cost: 2, title: "Callum Reed", meta: "Sentinels · Powered · Courier", atk: 1, steps: [3], mov: 2, pattern: "Default (adjacent enemy ahead)", ability: "Foresight", freq: "when deployed", text: "Recon 3. Put 1 of those cards in your hand. The rest go to the bottom of the deck in any order.", flavor: "“Duck. Trust me.”" },

    return { fit: c.fullArt ? { art: "1 1 0", ar: "auto", text: "0 0 auto" } : !isHalcyte ? { art: "0 1 auto", ar: "1.5", text: "1 0 auto" } : { art: "1 1 0", ar: "auto", text: "0 0 auto" }, c, box, leftH, w, h, sx: w / 250, sy: h / 350, isHalcyte, notHalcyte: !isHalcyte };
  }
}
</script>
